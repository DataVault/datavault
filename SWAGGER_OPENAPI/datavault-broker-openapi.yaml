      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        creationTime:
          type: string
          format: date-time
        grantEndDate:
          type: string
          format: date
        reviewDate:
          type: string
          format: date
        name:
          type: string
        description:
          type: string
        retentionPolicy:
          $ref: "#/components/schemas/RetentionPolicy"
        retentionPolicyStatus:
          type: integer
          format: int32
        retentionPolicyExpiry:
          type: string
          format: date-time
        retentionPolicyLastChecked:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
          deprecated: true
        dataset:
          $ref: "#/components/schemas/Dataset"
