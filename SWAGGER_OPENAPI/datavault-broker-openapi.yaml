          format: int64
        archiveDigest:
          type: string
        archiveDigestAlgorithm:
          type: string
        numOfChunks:
          type: integer
          format: int32
        encArchiveDigest:
          type: string
        encIV:
          type: string
          format: byte
        fileOrigin:
          type: string
