components:
  schemas:
    PermissionModel:
      type: object
      properties:
        id:
          type: string
        permission:
          type: string
          enum:
          - VIEW_DEPOSITS_AND_RETRIEVES
          - VIEW_VAULT_METADATA
          - VIEW_VAULT_ROLES
          - ASSIGN_VAULT_ROLES
          - VIEW_VAULT_HISTORY
          - CAN_TRANSFER_VAULT_OWNERSHIP
          - CAN_VIEW_VAULTS_SIZE
          - CAN_VIEW_IN_PROGRESS
          - CAN_VIEW_QUEUES
          - CAN_MANAGE_VAULTS
          - CAN_MANAGE_DEPOSITS
          - CAN_VIEW_RETRIEVES
          - CAN_VIEW_SCHOOL_ROLE_ASSIGNMENTS
          - CAN_ORPHAN_SCHOOL_VAULTS
          - MANAGE_SCHOOL_VAULT_DEPOSITS
          - VIEW_SCHOOL_VAULT_METADATA
          - VIEW_SCHOOL_VAULT_ROLES
          - ASSIGN_SCHOOL_VAULT_ROLES
          - VIEW_SCHOOL_VAULT_HISTORY
          - TRANSFER_SCHOOL_VAULT_OWNERSHIP
          - EDIT_SCHOOL_VAULT_METADATA
          - DELETE_SCHOOL_VAULT_DEPOSITS
          - CAN_RETRIEVE_DATA
          - CAN_MANAGE_BILLING_DETAILS
          - CAN_MANAGE_ROLES
          - CAN_MANAGE_PENDING_VAULTS
          - CAN_VIEW_EVENTS
          - CAN_MANAGE_RETENTION_POLICIES
          - CAN_MANAGE_ARCHIVE_STORES
          - CAN_MANAGE_SCHOOL_ROLE_ASSIGNMENTS
          - CAN_MANAGE_REVIEWS
        label:
          type: string
        type:
          type: string
          enum:
          - SCHOOL
          - VAULT
          - ADMIN
        schoolPermission:
          type: boolean
        vaultPermission:
          type: boolean
        adminPermission:
          type: boolean
    RoleModel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - SCHOOL
          - VAULT
          - ADMIN
        status:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionModel"
        assignedUserCount:
          type: integer
          format: int32
        idAsString:
          type: string
    RoleAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/RoleModel"
        userId:
          type: string
        schoolId:
          type: string
        vaultId:
          type: string
        pendingVaultId:
          type: string
    CreateClientEvent:
      type: object
      properties:
        remoteAddress:
          type: string
          description: The remote IP address which triggered this event
        userAgent:
          type: string
          description: The browser user agent (if applicable)
    DataCreator:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        name:
          type: string
    Dataset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        visible:
          type: boolean
        crisId:
          type: string
    RetentionPolicy:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        url:
          type: string
        minRetentionPeriod:
          type: integer
          format: int32
        extendUponRetrieval:
          type: boolean
        inEffectDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dataGuidanceReviewed:
          type: string
          format: date
        engine:
          type: string
          deprecated: true
        sort:
          type: integer
          format: int32
          deprecated: true
        minDataRetentionPeriod:
          type: string
          deprecated: true
        policyInfo:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        password:
          type: string
        email:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
