openapi: 3.1.0
info:
  title: DataVault WebApp API
  description: API documentation for the DataVault WebApp module.
  version: 0.0.0 (a16f01e)
  x-generated-at: 2026-03-30T16:09:07.486919
servers:
- url: http://localhost
  description: Generated server url
security:
- SSOHeaderAuth: []
tags:
- name: System
  description: Get Favicon
paths:
  /vaults/{vaultId}/updateVaultName:
    post:
      tags:
      - vaults-controller
      description: updates the vault name then redirects to vault page
      operationId: updateVaultName
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Form data for updating vault name
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /vaults/{vaultId}/updateVaultDescription:
    post:
      tags:
      - vaults-controller
      description: updates the vault description then redirects to vault page
      operationId: updateVaultDescription
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Form data for updating vault description
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DescriptionRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /vaults/{vaultId}/deposits/{depositId}/retrieve:
    get:
      tags:
      - deposits-controller
      description: shows to the retrieves page
      operationId: retrieveDeposit
      parameters:
      - name: retrieve
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Retrieve"
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      - name: depositId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - deposits-controller
      description: starts a deposit retrieval then redirects to show deposit page
      operationId: processRetrieve
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      - name: depositId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Retrieve"
      responses:
        "302":
          description: "Redirects to the vault details page (`/vaults/{vaultId}/deposits/{depositId}`)\
            \ after retrieve started."
          headers:
            Location:
              description: The target URL for the redirect.
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
  /vaults/{vaultId}/deposits/create:
    get:
      tags:
      - deposits-controller
      description: returns the deposit creation HTML page
      operationId: createDeposit
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - deposits-controller
      description: adds a deposit then redirects to show new vault deposit page
      operationId: createAndAddDeposit
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Deposit details sent as form data
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CreateDeposit"
        required: true
      responses:
        "302":
          description: "Redirects to the vault details page (`/vaults/{vaultId}/deposits/{depositId}`)\
            \ after deposit added."
          headers:
            Location:
              description: The target URL for the redirect.
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
  /vaults/{vaultId}/deleteDataManager:
    post:
      tags:
      - vaults-controller
      description: deletes 'uun' as dataManager from specified vault then redirects
        to vault page
      operationId: deleteDataManager
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      - name: uun
        in: query
        required: true
        schema:
          type: string
      requestBody:
        description: Form data for deleting data manager role from user
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UunRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /vaults/{vaultId}/data-owner/update:
    post:
      tags:
      - vaults-controller
      description: updates the vault ownership
      operationId: transferOwnership
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Ownership transfer details
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VaultTransferRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /vaults/{vaultId}/addDataManager:
    post:
      tags:
      - vaults-controller
      description: adds 'uun' as dataManager to specified vault then redirects
      operationId: addDataManager
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Form data for adding data manager role to user
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UunRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /vaults/stepCreate:
    post:
      tags:
      - vaults-controller
      description: Process the completed 'create new vault' page - based on action
        - return the appropriate HTML or redirect
      operationId: addVault
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CreateVaultForm"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /security/roles/{roleType}/{targetId}/user:
    post:
      tags:
      - role-assignment-controller
      description: creates a new role assignment
      operationId: createRoleAssignment
      parameters:
      - name: roleType
        in: path
        required: true
        schema:
          type: string
      - name: targetId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RoleAssignmentRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /security/roles/{roleType}/{targetId}/user/update:
    post:
      tags:
      - role-assignment-controller
      description: updates the role assignment
      operationId: updateRoleAssignment
      parameters:
      - name: roleType
        in: path
        required: true
        schema:
          type: string
      - name: targetId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UpdateRoleAssignmentRequest"
        required: true
      responses:
        "200":
          description: OK
  /security/roles/{roleType}/{targetId}/user/delete:
    post:
      tags:
      - role-assignment-controller
      description: removes a role assignment
      operationId: removeRoleAssignment
      parameters:
      - name: roleType
        in: path
        required: true
        schema:
          type: string
      - name: targetId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RemoveRoleAssignmentRequest"
      responses:
        "200":
          description: OK
  /fileupload:
    post:
      tags:
      - files-controller
      summary: Upload a file chunk
      operationId: fileUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata:
                  $ref: "#/components/schemas/FileUploadRequest"
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
  /filestores/sftp:
    post:
      tags:
      - file-store-controller
      summary: Add SFTP Filestore
      operationId: addSFTPFilestore
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AddSFTPFilestoreRequest"
      responses:
        "200":
          description: OK
  /filestores/local:
    post:
      tags:
      - file-store-controller
      summary: Add local filestore
      operationId: addLocalFilestore
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AddLocalFileStoreRequest"
      responses:
        "200":
          description: OK
  /admin/vaults/{vaultId}/reviews/{reviewId}:
    post:
      tags:
      - admin-reviews-controller
      description: processes the updated vault review
      operationId: processReview
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VaultReviewModelForm"
      responses:
        "302":
          description: |-
            ### Possible Redirects:
            * **Success:** Redirects to `/admin/reviews` after the review is processed.
            * **Cancel:** Redirects to `/admin/reviews` if the action is 'cancel'.
            * **Invalid Date:** Redirects to `/admin/vaults/{vaultId}/reviews` if the action is 'submit' and the date is invalid.
          headers:
            Location:
              description: The destination URL based on the logic described above.
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
  /admin/vaults/{vaultId}/checkretentionpolicy:
    post:
      tags:
      - admin-vaults-controller
      description: redirects to vaults HTML page for the specified vault after checking
        vault retention policy
      operationId: checkPolicy
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      responses:
        "302":
          description: "Redirects to the vault details page (`/admin/vaults/{vaultId}`)\
            \ after the retention policy check is complete."
          headers:
            Location:
              description: The target URL for the redirect.
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
  /admin/users/edit/{userId}:
    get:
      tags:
      - admin-users-controller
      description: returns the edit user HTML page
      operationId: editUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - admin-users-controller
      description: processes the edit user HTML page then shows vaults
      operationId: editUser_1
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UserForm"
      responses:
        "302":
          description: "Redirect: redirects to / if the action is 'cancel'"
          headers:
            Location:
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
        "200":
          description: An HTML page showing vaults
          content:
            text/html:
              schema:
                type: string
  /admin/users/create:
    get:
      tags:
      - admin-users-controller
      description: returns the create user HTML page
      operationId: createUserPage
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - admin-users-controller
      description: processes the create user HTML page
      operationId: addUser
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UserForm"
      responses:
        "302":
          description: "Redirect: if user does not exist - redirects to /admin/users\
            \ after creating user"
          headers:
            Location:
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
        "200":
          description: if user already exists just show HTML page to create user
          content:
            text/html:
              schema:
                type: string
  /admin/schools/{schoolId}/user:
    post:
      tags:
      - admin-schools-controller
      description: adds a new role assignment for the specified userId and role if
        the user has permission
      operationId: addNewRoleAssignment
      parameters:
      - name: schoolId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AddNewRoleAssignmentRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/schools/{schoolId}/user/update:
    post:
      tags:
      - admin-schools-controller
      description: updates role assignment with the specified role if the user has
        permission
      operationId: updateExistingRoleAssignment
      parameters:
      - name: schoolId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/UpdateExistingRoleAssignmentRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/schools/{schoolId}/user/delete:
    post:
      tags:
      - admin-schools-controller
      description: deletes the specified role assignment if the user has permission
      operationId: deleteRoleAssignment
      parameters:
      - name: schoolId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeleteRoleAssignmentRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/roles/save:
    post:
      tags:
      - admin-roles-controller
      description: Saves a Role that has been edited
      operationId: save
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RoleSaveRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/roles/op:
    post:
      tags:
      - admin-roles-controller
      description: assigns the specified user the SuperAdmin(IS) Role
      operationId: addSuperAdmin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SuperAdminRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/roles/deop:
    post:
      tags:
      - admin-roles-controller
      description: removes the specified user from the SuperAdmin(IS) Role
      operationId: deleteSuperAdmin
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeleteSuperAdminRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/roles/delete:
    post:
      tags:
      - admin-roles-controller
      description: Deletes the specified role as long as it is not assigned
      operationId: deleteRole
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeleteRoleRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/retentionpolicies/edit/{retentionPolicyId}:
    get:
      tags:
      - admin-retention-policies-controller
      description: returns an HTML page to allow a retentionpolicy to be edited
      operationId: editRetentionPolicyPage
      parameters:
      - name: retentionPolicyId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - admin-retention-policies-controller
      description: edits a retention policy and then redirects to show all retention
        policies
      operationId: editRetentionPolicy
      parameters:
      - name: retentionPolicyId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CreateRetentionPolicy"
      responses:
        "302":
          description: Redirects to /admin/retentionpolicies
          headers:
            Location:
              description: The URL to display all retentionpolicies
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: Invalid date format or ID
          content:
            '*/*':
              schema:
                type: string
  /admin/retentionpolicies/add:
    get:
      tags:
      - admin-retention-policies-controller
      description: returns an HTML page to allow a new retentionpolicy to be added
      operationId: addRetentionPolicyPage
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - admin-retention-policies-controller
      description: add a new retention policy
      operationId: addRetentionPolicy
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CreateRetentionPolicy"
      responses:
        "302":
          description: Redirects to /admin/retentionpolicies
          headers:
            Location:
              description: The URL to display all retentionpolicies
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: Invalid date format or ID
          content:
            '*/*':
              schema:
                type: string
  /admin/pendingVaults/edit:
    post:
      tags:
      - admin-pending-vaults-controller
      description: updates pending vault then return a redirect to continue edit of
        a pending vault
      operationId: editPendingVault
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CreateVaultForm"
      responses:
        "302":
          description: "Redirects to /admin/pendingVaults/edit/{vaultId}"
          headers:
            Location:
              description: The URL to continue editing the pending vault
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
  /admin/paused/retrieve/toggle:
    post:
      tags:
      - admin-paused-retrieve-state-controller
      description: toggles the 'pause retrieve state' and returns the paused retrieve
        state HTML page
      operationId: toggleRetrievePause
      responses:
        "302":
          description: State toggled successfully. Redirecting to history page.
          headers:
            Location:
              description: URL of the history page
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
        "403":
          description: Forbidden - User lacks IS_ADMIN role
          content:
            '*/*':
              schema:
                type: string
  /admin/paused/deposit/toggle:
    post:
      tags:
      - admin-paused-deposit-state-controller
      description: toggles the 'pause deposits state' and returns the paused deposit
        state HTML page
      operationId: toggleDepositPause
      responses:
        "302":
          description: State toggled successfully. Redirecting to history page.
          headers:
            Location:
              description: URL of the history page
              style: simple
              schema: {}
          content:
            '*/*':
              schema:
                type: string
        "403":
          description: Forbidden - User lacks IS_ADMIN role
          content:
            '*/*':
              schema:
                type: string
  /admin/billing/updateBillingDetails:
    post:
      tags:
      - admin-billing-controller
      description: updates billing details and returns HTML page based on billing
        type
      operationId: updateBillingDetails
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/BillingInfo"
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /admin/archivestores/{archiveStoreId}/update/properties:
    post:
      tags:
      - admin-archive-store-controller
      summary: Update store properties
      operationId: updateArchiveStore
      parameters:
      - name: archiveStoreId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ArchiveStoredUpdateRequest"
      responses:
        "200":
          description: OK
  /admin/archivestores/{archiveStoreId}/enable:
    post:
      tags:
      - admin-archive-store-controller
      operationId: enableRetrieve
      parameters:
      - name: archiveStoreId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /admin/archivestores/{archiveStoreId}/disable:
    post:
      tags:
      - admin-archive-store-controller
      operationId: disableRetrieve
      parameters:
      - name: archiveStoreId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /admin/archivestores/local:
    post:
      tags:
      - admin-archive-store-controller
      summary: Add local Archive Store
      operationId: addLocalArchiveStore
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ArchiveStoreRequest"
      responses:
        "200":
          description: OK
  /welcome:
    get:
      tags:
      - welcome-controller
      description: displays the welcome HTML page
      operationId: welcome
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /vaults:
    get:
      tags:
      - vaults-controller
      description: returns HTML page listing vaults
      operationId: getVaultsListing
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /vaults/{vaultId}:
    get:
      tags:
      - vaults-controller
      description: returns HTML page for specific vault
      operationId: getVaultByVaultId
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /vaults/{vaultId}/{userId}:
    get:
      tags:
      - vaults-controller
      description: returns HTML page for showing all vaults associated with a user
      operationId: getUserVaults
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /vaults/{vaultId}/deposits/{depositId}:
    get:
      tags:
      - deposits-controller
      description: returns the deposit HTML page
      operationId: getDeposit
      parameters:
      - name: vaultId
        in: path
        required: true
        schema:
          type: string
      - name: depositId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /vaults/{vaultId}/deposits/{depositId}/retrieves/{retrieveId}/restart:
    get:
