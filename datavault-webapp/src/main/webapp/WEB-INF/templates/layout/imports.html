<!--layout/imports.html-->
<th:block id="imports">
    <link rel="icon" type="image/ico" th:href="@{/resources/favicon.ico?v=2}"/>

    <!-- CSS -->
    <link th:href="@{/resources/fancytree/2.38.5/skin-lion/ui.fancytree.min.css}" rel="stylesheet" type="text/css">

    <link th:href="@{/resources/theme/css/createVault.css}" rel="stylesheet" type="text/css">

    <!-- jQuery js -->

    <script th:src="@{/resources/jquery/js/jquery-3.7.1.min.js}"></script>
    <!-- <script th:src="@{https://code.jquery.com/jquery-migrate-3.4.1.min.js}"></script> -->

    <!-- jQuery UI js -->

    <script th:src="@{/resources/jquery-ui/1.13.2/jquery-ui.min.js}"></script>
    <link th:href="@{/resources/jquery-ui/1.13.2/jquery-ui.min.css}" rel="stylesheet" type="text/css">

    <!-- Bootstrap 5 -->
    <link th:href="@{/resources/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet" type="text/css">
    <script th:src="@{/resources/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" type="text/css">

    <!-- Bootstrap-Select (for Bootstrap 5) -->
    <link th:href="@{/resources/bootstrap-select/1.14.0/css/bootstrap-select.min.css}" rel="stylesheet" type="text/css">
    <script th:src="@{/resources/bootstrap-select/1.14.0/js/bootstrap-select.min.js}"></script>

    <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css" rel="stylesheet" type="text/css"/>  -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script> -->

    <!-- jQuery validate js -->
    <script th:src="@{/resources/jquery-validate/js/1.19.5/jquery.validate.min.js}"></script>

    <!-- Fancytree js -->
    <script th:src="@{/resources/fancytree/2.38.3/jquery.fancytree-all.min.js}"></script>


    <!-- Flow.js -->
    <script th:src="@{/resources/flow/js/flow.min.js}"></script>

    <!-- Spring Security CSRF (ajax) -->
    <meta name="_csrf" th:content="${_csrf?.token ?: ''}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName ?: ''}" />

    <!-- For IE compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Jackie CSS, JS and IMG -->

    <!--<link th:href="@{/resources/theme/edgel-4.11.3/edgel-red.min.css}" rel="stylesheet" type="text/css">-->
    <link th:href="@{/resources/theme/edgel-5.3.5/edgel-red.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/resources/theme/jackie/jackie.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/resources/theme/jackie/jackie-quickfix.css}" rel="stylesheet" type="text/css">
    
    <!-- Styles to be overriden -->
    <link th:href="@{/resources/theme/css/overrideStyles.css}" rel="stylesheet" type="text/css">

    <!-- Error Handler JS -->
    <script th:src="@{/resources/theme/js/ErrorHandler.js}"></script>
    <script th:inline="javascript" type="text/javascript">
        const contextPath = /*[(|'@{/}'|)]*/ 'replaced-by-tl';
        const springContextPath = contextPath.replace(/\/+$/, ''); //remove trailing slash
        ErrorHandler.initialiseSpringContextPath(springContextPath);

        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        [...tooltipTriggerList].forEach(el => new bootstrap.Tooltip(el));
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        [...popoverTriggerList].forEach(el => new bootstrap.Popover(el));

    </script>
</th:block>
