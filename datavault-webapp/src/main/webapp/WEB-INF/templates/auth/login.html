<!DOCTYPE html><!--auth/login.html-->
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/loginlayout}">
<head><title>Authentication - Login</title></head>
<th:block layout:fragment="content">
    <div class="p-5 mb-4 bg-light rounded-3">
        <div class="text-center">
            <img width="300px" border="0" th:src="@{/resources/theme/images/logo-dvlarge.png}" />
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-sm-4 offset-sm-4 col-md-4 offset-md-4">
                <form class="p-4 p-md-5 border rounded-3 bg-light" th:action="@{/auth/security_check}" method="post">
                    <div th:if="${!#strings.isEmpty(welcome)}" class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span class="visually-hidden">Success:</span>
                        <span class="col-md-11">[[${welcome}]]</span>
                    </div>
                    <div th:if="${!#strings.isEmpty(success)}" class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span class="visually-hidden">Success:</span>
                        <span class="col-md-11">[[${success}]]</span>
                    </div>
                    <div th:if="${!#strings.isEmpty(error)}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span class="visually-hidden">Error:</span>
                        <span class="col-md-11">[[${error}]]</span>
                    </div>
                    <div class="form-group">
                        <label for="username" class="sr-only">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password" class="sr-only">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    <div class="form-group">
                        <input class="btn btn-lg btn-primary btn-block" type="submit" value="Sign in" />
                    </div>
                    <input type="hidden" th:name="${_csrf?.parameterName ?: ''}" th:value="${_csrf?.token ?: ''}" />
                </form>
            </div>
        </div>
    </div>
</th:block>
</html>
